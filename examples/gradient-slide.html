<!doctype html><html lang="en"><meta charset="utf-8"><title>Editable PPTX example</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1280px;height:720px;overflow:hidden;font-family:Arial,sans-serif}.ppt-slide{position:relative;width:1280px;height:720px;overflow:hidden;color:#f7f9ff;background:radial-gradient(circle at 24% 18%,#334a94 0%,#152143 43%,#0a1126 100%)}
.orb{position:absolute;right:-100px;top:-175px;width:560px;height:560px;border-radius:50%;background:radial-gradient(circle,#748cff55 0%,#748cff00 72%);filter:blur(14px)}.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:40px 40px}.content{position:relative;padding:75px 82px}.eyebrow{display:inline-block;padding:9px 17px;border:1px solid #859dff88;border-radius:20px;color:#b8c9ff;font-size:17px;letter-spacing:2px}.title{margin:32px 0 12px;font-size:61px;line-height:1.08;letter-spacing:-2px}.subtitle{font-size:23px;color:#c5d0ed}.cards{display:flex;gap:20px;margin-top:65px}.card{width:350px;min-height:195px;padding:28px;border:1px solid #ffffff30;border-radius:18px;background:#ffffff12;box-shadow:0 14px 40px #00000024}.number{font-size:39px;font-weight:bold;color:#93b8ff}.label{margin-top:14px;font-size:20px}.note{margin-top:18px;color:#aab9d5;font-size:15px}
</style><body><div class="ppt-slide"><div class="grid"></div><div class="orb"></div><div class="content"><div class="eyebrow">HTML TO PPTX</div><h1 class="title">Keep the design.<br>Keep the text editable.</h1><div class="subtitle">Browser-rendered slides, rebuilt for PowerPoint.</div><div class="cards"><div class="card"><div class="number">01</div><div class="label">Measure the browser</div><div class="note">Use the final DOM layout and computed styles.</div></div><div class="card"><div class="number">02</div><div class="label">Preserve native text</div><div class="note">Edit slide copy directly in PowerPoint.</div></div><div class="card"><div class="number">03</div><div class="label">Capture complex CSS</div><div class="note">Use local visual layers where needed.</div></div></div></div></div></body></html>
